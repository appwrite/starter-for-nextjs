version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      version-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - '*'
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    groups:
      version-updates:
        applies-to: version-updates
        update-types:
          - minor
          - patch
        patterns:
          - '*'
      security-updates:
        applies-to: security-updates
        patterns:
          - '*'
    commit-message:
      prefix: chore
      include: scope
